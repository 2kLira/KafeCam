name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: KafeCam
  DESTINATION: "platform=iOS Simulator,name=iPhone 16 Pro"

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # iOS 26 requires Xcode 26. Update this path when GitHub adds
      # Xcode 26 to hosted runners (https://github.com/actions/runner-images).
      # For now use a self-hosted runner with Xcode 26 installed, or pin to
      # the available beta path.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      # Inject Supabase credentials from GitHub Secrets into xcconfig.
      # Required secrets: SUPABASE_URL, SUPABASE_ANON_KEY
      - name: Generate KafeCamSecrets.xcconfig
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/generate_xcconfig.sh

      # MLX packages are large (~1 GB resolved). Cache keyed on Package.resolved.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('KafeCam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -testPlan KafeCam.xctestplan \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 14
