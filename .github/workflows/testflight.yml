name: TestFlight

on:
  # Push a tag like v1.2.3 to trigger a deploy
  push:
    tags:
      - 'v*'
  # Or trigger manually from GitHub → Actions → TestFlight → Run workflow
  workflow_dispatch:

env:
  SCHEME: KafeCam
  BUNDLE_ID: com.chochesanchez.KafeCam
  TEAM_ID: CLE629MGG8

jobs:
  deploy:
    name: Archive & Upload to TestFlight
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Generate KafeCamSecrets.xcconfig
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/generate_xcconfig.sh

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('KafeCam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # ── Code signing ────────────────────────────────────────────────────────
      # Required secrets:
      #   DIST_CERT_P12      → base64 of your distribution .p12
      #                        openssl base64 -in Certificates.p12 | tr -d '\n'
      #   DIST_CERT_PASSWORD → password used when exporting the .p12
      #   KEYCHAIN_PASSWORD  → any random string, used for the temp keychain
      - name: Install distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Required secret:
      #   PROVISIONING_PROFILE → base64 of your App Store .mobileprovision
      #                          The profile name must match ExportOptions.plist
      #                          openssl base64 -in KafeCam.mobileprovision | tr -d '\n'
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PP_DIR/KafeCam_AppStore.mobileprovision"

      # ── Build ────────────────────────────────────────────────────────────────
      # Build number = GitHub Actions run number (auto-increments with each run)
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/KafeCam.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="KafeCam AppStore" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | xcpretty

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KafeCam.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ci/ExportOptions.plist

      # ── Upload ───────────────────────────────────────────────────────────────
      # Required secrets:
      #   ASC_KEY_ID     → App Store Connect API key ID (e.g. ABC1234567)
      #   ASC_ISSUER_ID  → Issuer UUID from App Store Connect
      #   ASC_API_KEY_P8 → Contents of the .p8 file (not base64, raw text)
      #                    App Store Connect → Users & Access → Integrations → Keys
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" > \
            ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/KafeCam.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
